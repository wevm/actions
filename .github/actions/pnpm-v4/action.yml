name: "pnpm"
description: "Set up pnpm and install dependencies"

inputs:
  node-version:
    description: 'Node.js version'
    required: false
    default: 22.18.0
  skip-cache:
    description: 'Skip dependency cache restore/save'
    required: false
    default: 'false'

runs:
  using: "composite"
  steps:
    - name: Set up pnpm and install dependencies
      uses: wevm/actions/.github/actions/pnpm@9bf103bd47b43c77baa02648201039b6ef3d713b # v1.0.1
      with:
        node-version: ${{ inputs.node-version }}
        skip-cache: ${{ inputs.skip-cache }}
