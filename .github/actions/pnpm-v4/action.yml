name: "pnpm"
description: "Set up pnpm and install dependencies"

inputs:
  node-version:
    description: 'Node.js version'
    required: false
    default: 22.18.0
  skip-cache:
    description: 'Skip dependency cache restore/save'
    required: false
    default: 'false'

runs:
  using: "composite"
  steps:
    - name: Set up pnpm and install dependencies
      uses: wevm/actions/.github/actions/pnpm@e1f868d7ecd1c5a1eaaca871c42180d9c37badbb # v1.0.1
      with:
        node-version: ${{ inputs.node-version }}
        skip-cache: ${{ inputs.skip-cache }}
