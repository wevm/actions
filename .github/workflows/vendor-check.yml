name: Vendor check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test tooling, first-party actions and reusable workflows
        shell: bash
        run: |
          mapfile -d '' tests < <(
            find vendor -maxdepth 1 -type f \( -name '*.test.js' -o -name '*.test.mjs' \) -print0
            find .github -type f \( -name '*.test.js' -o -name '*.test.mjs' \) -print0
          )
          node --test "${tests[@]}"
      - run: node vendor/sync.mjs --check

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate workflows with actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/*.yml
      - name: Scan first-party workflows and actions
        uses: wevm/actions/vendor/zizmorcore/zizmor-action/v0.7.0@ff2e489195c2eb75f07b3fecad79cec5b39854c5
        with:
          inputs: .github/workflows .github/actions
          version: 1.31.0
          advanced-security: false
          online-audits: false

  pnpm-smoke:
    name: ${{ matrix.action }} (skip-cache=${{ matrix.skip-cache }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        action: [pnpm, pnpm-v4]
        skip-cache: ['false', 'true']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: actions
      - name: Prepare a dependency-install fixture and the wrapper under review
        env:
          ACTION: ${{ matrix.action }}
        run: |
          cp -R actions/.github/fixtures/pnpm/. .
          mkdir -p actions/.amp/in
          cp -R "actions/.github/actions/$ACTION" actions/.amp/in/pnpm-action
      - name: Install with default Node and caching
        if: matrix.skip-cache == 'false'
        uses: ./actions/.amp/in/pnpm-action # zizmor: ignore[self-repository] The wrapper is staged dynamically, not committed at this path.
      - name: Install with custom Node and no caching
        if: matrix.skip-cache == 'true'
        uses: ./actions/.amp/in/pnpm-action # zizmor: ignore[self-repository] The wrapper is staged dynamically, not committed at this path.
        with:
          node-version: 24.0.0
          skip-cache: 'true'
      - name: Verify the installed dependency and tool versions
        env:
          EXPECTED_NODE: ${{ matrix.skip-cache == 'true' && 'v24.0.0' || 'v22.18.0' }}
        run: |
          test "$(node --version)" = "$EXPECTED_NODE"
          test "$(pnpm --version)" = '10.11.0'
          node -e 'require("node:assert/strict").equal(require("fixture-value"), 37)'
